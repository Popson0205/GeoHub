# Runs on every pull request and on pushes to main: the frontend checks and the backend suite.
# A pull request should only be merged when both jobs are green.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (pytest against PostGIS, Redis and S3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: hub, POSTGRES_PASSWORD: hub, POSTGRES_DB: hub_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hub" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: GDAL (imagery and import jobs)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin
      - run: pip install -r requirements-dev.txt
      - run: cp .env.test.example .env.test
      - name: S3 stand-in
        run: |
          python -m moto.server -p 5555 > /tmp/moto.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5555 >/dev/null && break; sleep 1; done
      - run: pytest -q
