# Optional: run against a throwaway local PostGIS instead of Supabase (offline development).
#   docker compose -f docker-compose.yml -f docker-compose.localdb.yml up --build
x-localdb: &localdb
  environment: {DATABASE_URL: "postgresql://hub:hub@db:5432/hub"}
  depends_on: {db: {condition: service_healthy}}

services:
  db:
    image: postgis/postgis:16-3.4
    environment: {POSTGRES_USER: hub, POSTGRES_PASSWORD: hub, POSTGRES_DB: hub}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U hub"], interval: 5s, timeout: 5s, retries: 10}
  api: *localdb
  worker: *localdb
  backup: *localdb
  martin:
    environment: {DATABASE_URL: "postgresql://hub:hub@db:5432/hub"}
    depends_on: {db: {condition: service_healthy}}
volumes: {pgdata: {}}
